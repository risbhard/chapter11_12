<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Mogul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette and type. Layout idea: a 1920x1080 projector stage (scoreboard | board | turn panel) and a separate phone page. */
:root{
  --felt:#12483F; --felt-dark:#0B2B26; --cream:#F3EEDD; --ink:#1B1B1B; --red:#C8282D; --yellow:#FFD23F;
  --sage:#CFE3CF; --mute:#4A4A4A; --line:#CFC8B0; --good:#1E7A4C; --bad:#B3261E;
  --display:'Alfa Slab One',Georgia,serif; --body:'Rubik',system-ui,Arial,sans-serif; --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--felt);color:var(--ink);font-family:var(--body);overflow:hidden}
button{font-family:var(--body);cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.shp{display:inline-block;flex:none}

/* ---------- projector stage ---------- */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;padding:24px 40px;display:flex;flex-direction:column;gap:16px}
.banner{display:flex;align-items:stretch;background:var(--ink);border:4px solid var(--yellow);border-radius:12px;overflow:hidden;height:80px;flex:none}
.banner .step{background:var(--yellow);color:var(--ink);font-family:var(--display);font-size:28px;padding:0 30px;display:flex;align-items:center;white-space:nowrap}
.banner .msg{flex:1;color:var(--cream);font-size:29px;line-height:1.15;font-weight:600;padding:0 28px;display:flex;align-items:center}
.banner .tools{display:flex;gap:10px;align-items:center;padding:0 18px}
.banner .tools button{font:700 22px var(--body,inherit);background:var(--yellow);color:var(--ink);border:3px solid var(--cream);border-radius:999px;padding:8px 20px;cursor:pointer;white-space:nowrap}
.banner .tools button.end{background:transparent;color:var(--cream)}
.banner .tools button:hover{filter:brightness(1.1)}
.banner .hint{color:var(--sage);font-size:20px;padding:0 28px;display:flex;align-items:center;white-space:nowrap}
.row{display:flex;gap:26px;flex:1;min-height:0;justify-content:center}
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--felt-dark);padding:18px 20px}
.panel h2{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:28px}
.lcol{width:380px;display:flex;flex-direction:column;gap:18px}
.rcol{width:430px;display:flex;flex-direction:column;gap:18px}
.team{display:flex;align-items:center;gap:12px;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;margin-bottom:8px}
.team.on{background:var(--yellow)}
.team .nm{font-weight:700;font-size:22px;line-height:1.1;overflow-wrap:anywhere}
.team .sub{font-size:17px;color:var(--mute)}
.team .cash{font-weight:700;font-size:26px;text-align:right}
.tag{display:inline-block;background:var(--ink);color:var(--cream);font-size:14px;font-weight:700;letter-spacing:1px;border-radius:4px;padding:2px 8px}
.setrow{display:flex;align-items:center;gap:12px;margin:4px 0;font-size:18px;font-weight:600}
.setrow .sw{width:36px;height:22px;border:2px solid var(--ink);border-radius:4px;flex:none}
.setrow .ct{margin-left:auto;font-weight:500;color:var(--mute);font-size:17px;text-align:right}

/* board */
.board{position:relative;width:936px;height:936px;flex:none;display:grid;grid-template-columns:126px 684px 126px;grid-template-rows:126px 684px 126px;background:var(--cream);border:4px solid var(--ink);box-shadow:7px 7px 0 var(--felt-dark);margin-top:0}
.strip{display:flex}
.strip.v{flex-direction:column}
.tile{flex:1 1 0;min-width:0;min-height:0;display:flex;border:1px solid var(--ink);background:var(--cream);position:relative;overflow:hidden}
.tile.top,.tile.bottom{flex-direction:column}
.tile.left,.tile.right{flex-direction:row}
.tile .band{flex:none}
.tile.top .band{height:20px;order:2;border-top:1px solid var(--ink)}
.tile.bottom .band{height:20px;order:0;border-bottom:1px solid var(--ink)}
.tile.left .band{width:20px;order:2;border-left:1px solid var(--ink)}
.tile.right .band{width:20px;order:0;border-right:1px solid var(--ink)}
.tile .tb{flex:1;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:5px 3px 4px;min-width:0}
.tile .nm{font-family:var(--cond);font-weight:700;font-size:16px;line-height:1.02;text-transform:uppercase;letter-spacing:.2px}
.tile.left .nm,.tile.right .nm{font-size:18px}
.tile .pr{font-family:var(--cond);font-weight:700;font-size:20px;display:flex;align-items:center;gap:5px}
.tile .tok{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;min-height:20px}
.tile.left .tb,.tile.right .tb{align-items:stretch;text-align:left;padding:5px 8px}
.tile.left .tb .bot,.tile.right .tb .bot{display:flex;justify-content:space-between;align-items:center}
.tile.card{align-items:center;justify-content:center}
.tile.card .tb{justify-content:center;gap:6px}
.tile.hot{outline:5px solid var(--yellow);outline-offset:-5px;z-index:2;background:#FFF6CC}
.tile.full{box-shadow:inset 0 0 0 4px #E3A800}
.corner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--ink);background:var(--cream);padding:6px;position:relative}
.corner .cn{font-family:var(--display);font-size:20px;line-height:1.05}
.corner .cs{font-size:14px;font-weight:600;margin-top:2px}
.corner .tok{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:4px}
.corner.hot{outline:5px solid var(--yellow);outline-offset:-5px;background:#FFF6CC}
.centre{grid-column:2;grid-row:2;background:var(--sage);border:1px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:50px 36px 40px;text-align:center}
.logo{background:var(--red);color:#fff;border:4px solid var(--ink);border-radius:8px;padding:14px 30px;font-family:var(--display);font-size:62px;line-height:1;letter-spacing:1px;box-shadow:6px 6px 0 var(--ink)}
.sub1{margin-top:18px;font-size:23px;font-weight:700;letter-spacing:3px}
.clock{font-family:var(--display);font-size:72px;line-height:1}
.clock small{display:block;font-family:var(--body);font-size:21px;font-weight:600;letter-spacing:2px;margin-top:6px}
.decks{display:flex;gap:36px}
.deck{width:240px;height:130px;border:4px solid var(--ink);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:6px 6px 0 var(--ink)}
.deck b{font-family:var(--display);font-weight:400;font-size:27px}
.deck span{font-size:17px;font-weight:600;margin-top:4px}
.joinpill{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:10px 22px;font-size:21px;font-weight:600}
.joinpill b{font-family:var(--display);font-weight:400;letter-spacing:5px;font-size:30px}

/* overlays on the board */
.ov{position:absolute;z-index:5;background:var(--cream);border:4px solid var(--ink);box-shadow:7px 7px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden}
.ov.full{inset:0}
.ov.mid{left:126px;top:126px;width:684px;height:684px;border-width:4px}
.ov .hd{padding:14px 28px;border-bottom:4px solid var(--ink);display:flex;justify-content:space-between;align-items:center}
.ov .hd .a{font-size:19px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.ov .hd .b{font-family:var(--display);font-size:38px;line-height:1.05}
.ov .hd .c{font-family:var(--display);font-size:50px}
.ov .bd{flex:1;padding:24px 34px;display:flex;flex-direction:column;gap:20px;min-height:0}
.q{font-size:40px;line-height:1.26;font-weight:500}
.q.long{font-size:32px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:auto}
.opt{display:flex;align-items:center;gap:14px;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:14px 18px;font-size:29px;font-weight:600;line-height:1.15;min-height:84px}
.opt i{font-style:normal;font-family:var(--display);width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:25px;flex:none}
.blankbox{margin-top:auto;border:3px dashed var(--ink);border-radius:12px;padding:20px 24px;font-size:28px;background:#fff;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:999px;padding:5px 14px 5px 8px;background:#fff;font-size:19px;font-weight:600}
.chip.ok{background:#CBEBD6}
.timerbar{height:14px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;flex:1}
.timerbar div{height:100%;background:var(--red)}
.ans{border:3px solid var(--ink);border-radius:12px;background:#CBEBD6;padding:16px 22px;font-size:29px;font-weight:700}
.opt.right{background:#CBEBD6;border-color:var(--good)}
.exp{font-size:25px;line-height:1.35}
.big{font-family:var(--display);font-size:52px;line-height:1.05}
.tone-good .hd{background:#CBEBD6}.tone-bad .hd{background:#F6C9C4}.tone-warn .hd{background:#FFE9A8}.tone-neutral .hd{background:var(--sage)}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.sc{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:5px 10px;font-size:19px;font-weight:600;flex-wrap:wrap}
.sc.me{background:#FFF1B8;border-width:3px}
.sc .n{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .m{font-family:var(--display);font-size:24px;margin-left:auto}
.sc em{font-style:normal;font-weight:800}.sc em.up{color:#1E7B3F}.sc em.dn{color:#B3261E}
.sc .w{flex-basis:100%;font-size:15px;font-weight:500;color:var(--mute)}
.cardface{border:4px solid var(--ink);border-radius:14px;padding:20px 24px;background:#fff;font-size:30px;line-height:1.3;font-weight:500}

/* controls */
.btn{display:block;width:100%;border:4px solid var(--ink);border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:32px;letter-spacing:1px;padding:16px 10px;box-shadow:0 0 0 6px var(--yellow),5px 5px 0 6px var(--ink);margin:6px 0}
.btn:disabled{background:#E4DFCC;border-color:#8A8468;color:#6B6652;box-shadow:none}
.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 0 0 6px var(--yellow),5px 5px 0 6px var(--ink)}
.btn.alt:disabled{background:#E4DFCC}
.btn.sm{font-size:22px;padding:11px 8px;box-shadow:none}
.btn.quiet{background:#fff;color:var(--ink);box-shadow:none;border-width:3px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:6px 0}
.steps{display:flex;flex-direction:column;gap:7px;margin:12px 0 14px}
.st{display:flex;align-items:center;gap:12px;padding:8px 12px;border:3px solid var(--line);border-radius:10px;background:#E4DFCC;color:#6B6652;font-size:23px;font-weight:600}
.st b{width:32px;height:32px;border-radius:50%;background:#8A8468;color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.st.now{background:var(--yellow);color:var(--ink);border-color:var(--ink)}.st.now b{background:var(--ink);color:var(--yellow)}
.st.done{background:#fff;color:var(--ink);border-color:var(--line)}.st.done b{background:var(--good)}
.dice{display:flex;gap:18px;justify-content:center;margin:6px 0 4px;min-height:96px}
.die{width:92px;height:92px;background:#fff;border:4px solid var(--ink);border-radius:16px;display:flex;align-items:center;justify-content:center}
.die.empty{border-style:dashed;opacity:.5;font-family:var(--display);font-size:42px}
.die.roll{animation:wob .18s infinite alternate}
@keyframes wob{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.log{font-size:19px;line-height:1.3;padding:7px 0;border-bottom:1px solid var(--line)}
.notice{border:3px solid var(--good);background:#E3F4EA;border-radius:10px;padding:12px 14px;font-size:20px;line-height:1.3}
.hot-pulse{animation:pulse 1.1s infinite alternate}
@keyframes pulse{from{filter:none}to{filter:brightness(1.15)}}
@media (prefers-reduced-motion:reduce){.die.roll,.hot-pulse{animation:none}}
.link{background:none;border:none;color:var(--sage);text-decoration:underline;font-size:18px;padding:6px}
#net{position:absolute;left:14px;bottom:8px;font-size:16px;color:var(--sage);z-index:20}

/* setup, lobby, end */
.screen{flex:1;display:flex;gap:34px;justify-content:center;align-items:flex-start;padding-top:10px}
.hero{width:760px}
.hero .logo{display:inline-block;font-size:76px}
.pill{display:inline-flex;gap:0;border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.pill button{border:none;background:#fff;font-size:26px;font-weight:700;padding:10px 20px;border-right:2px solid var(--ink)}
.pill button:last-child{border-right:none}
.pill button.on{background:var(--yellow)}
.field{display:flex;align-items:center;gap:12px;margin:8px 0}
.field input{flex:1;font-family:var(--body);font-size:24px;font-weight:600;padding:9px 12px;border:3px solid var(--ink);border-radius:8px;background:#fff}
.lbl{font-size:20px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin:16px 0 8px}
.code{font-family:var(--display);font-size:190px;line-height:1;letter-spacing:14px;color:var(--red);text-shadow:4px 4px 0 var(--ink)}
.seat{display:flex;align-items:center;gap:14px;padding:12px 16px;border:3px solid var(--ink);border-radius:10px;background:#fff;margin-bottom:10px;font-size:27px;font-weight:700}
.seat.in{background:#CBEBD6}.seat .s2{margin-left:auto;font-size:20px;font-weight:600;color:var(--mute)}
.podium{display:flex;align-items:flex-end;gap:22px;justify-content:center;margin:20px 0}
.pod{width:230px;border:4px solid var(--ink);border-radius:12px 12px 0 0;background:#fff;text-align:center;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pod .rk{font-family:var(--display);font-size:56px}.pod .pn{font-weight:700;font-size:24px}.pod .nw{font-size:26px;font-weight:700}
table.res{width:100%;border-collapse:collapse;font-size:24px}
table.res th,table.res td{padding:9px 10px;border-bottom:2px solid var(--line);text-align:left}
table.res td.n,table.res th.n{text-align:right}
.modal{position:absolute;inset:0;z-index:30;background:rgba(11,43,38,.82);display:flex;align-items:center;justify-content:center}
.modal .panel{width:900px;padding:30px 36px}
.modal ol{font-size:30px;line-height:1.45;padding-left:38px;margin:10px 0 22px}

/* ---------- phone ---------- */
#phone{position:absolute;inset:0;overflow:auto;display:none;flex-direction:column;background:var(--felt);color:var(--cream)}
.ph-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.ph-top .who{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;min-width:0}
.ph-top .who span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-top .cash{font-family:var(--display);font-size:28px}
.ph-card{margin:6px 14px 0;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--felt-dark);overflow:hidden;display:flex;flex-direction:column}
.ph-card .h{padding:12px 16px;border-bottom:3px solid var(--ink)}
.ph-card .h small{display:block;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.ph-card .h b{font-family:var(--display);font-weight:400;font-size:24px}
.ph-card .b{padding:16px;display:flex;flex-direction:column;gap:14px}
.ph-q{font-size:21px;line-height:1.4;font-weight:500}
.ph-opt{display:flex;align-items:center;gap:12px;min-height:66px;width:100%;text-align:left;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);font-size:21px;font-weight:600;padding:10px 14px;box-shadow:3px 3px 0 var(--ink)}
.ph-opt i{font-style:normal;font-family:var(--display);width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.ph-opt.sel{background:var(--yellow)}
.ph-opt.ok{background:#CBEBD6;border-color:var(--good)}
.ph-opt:disabled{opacity:.6;box-shadow:none}
.ph-btn{width:100%;min-height:64px;border:3px solid var(--ink);border-radius:14px;background:var(--red);color:#fff;font-size:22px;font-weight:700;letter-spacing:1px}
.ph-btn:disabled{background:#B9B39B;color:#4b4738}
.ph-in{width:100%;font-family:var(--display);font-size:46px;letter-spacing:10px;text-align:center;text-transform:uppercase;padding:12px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
.ph-note{margin:14px 18px 22px;text-align:center;font-size:16px;color:var(--sage);line-height:1.4}
.ph-seat{display:flex;align-items:center;gap:14px;min-height:68px;width:100%;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);font-size:22px;font-weight:700;padding:10px 14px;text-align:left}
.ph-seat:disabled{opacity:.45}
.ph-big{font-family:var(--display);font-size:34px;line-height:1.1}
.ph-sub{font-size:19px;line-height:1.4}
.ph-timer{height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.ph-timer div{height:100%;background:var(--red)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="phone"></div>
<div id="net"></div>

// Marketing Mogul game engine.
// Pure, UI-independent rules and state machine. No DOM, no network, no timers.
// The projector page owns the authoritative state; phones only send answers
// and receive phoneView() snapshots. All time comes in through `now` (ms).

const PHASES = {
  ROLL: 'roll',         // step 1: team on turn rolls (or chooses in Recall)
  MOVE: 'move',         // step 2: token moves (UI animates, then sends MOVE_DONE)
  OFFER: 'offer',       // step 3: team decides whether to try to buy an empty space
  QUESTION: 'question', // step 3: teams lock in answers on phones
  JUDGE: 'judge',       // step 3: host taps Correct or Wrong (fill-in-the-blank)
  RESULT: 'result',     // step 4: outcome shown, host presses Next team
  ENDED: 'ended'
};

// Small seeded PRNG (mulberry32) so games and tests are reproducible.
function nextRandom(state) {
  state.rng = (state.rng + 0x6d2b79f5) >>> 0;
  let t = state.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function randInt(state, n) { return Math.floor(nextRandom(state) * n); }
function shuffle(state, arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(state, i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function createEngine({ config, questions }) {
  const spaces = config.spaces;
  const RECALL_INDEX = spaces.find((s) => s.kind === 'recall').i;
  const LAUNCH_INDEX = spaces.find((s) => s.kind === 'launch').i;
  const N = spaces.length;
  const qById = Object.fromEntries(questions.map((q) => [q.id, q]));
  const qBySpace = {};
  for (const s of spaces) {
    if (s.kind !== 'question') continue;
    const q = questions.find((x) => x.chapter === s.chapter && x.price === s.price);
    if (!q) throw new Error(`No question for space ${s.i} (${s.chapter} $${s.price})`);
    qBySpace[s.i] = q.id;
  }
  const chapterSpaces = {};
  for (const s of spaces) {
    if (s.kind === 'question') (chapterSpaces[s.chapter] ||= []).push(s.i);
  }

  const clone = (s) => structuredClone(s);
  const activeTeam = (s) => s.teams[s.turn];
  const teamById = (s, id) => s.teams.find((t) => t.id === id);

  function ownsFullSet(state, teamId, chapter) {
    return chapterSpaces[chapter].every((i) => state.owners[i] === teamId);
  }
  function rentFor(state, spaceIndex) {
    const sp = spaces[spaceIndex];
    const owner = state.owners[spaceIndex];
    if (owner === undefined) return 0;
    let rent = Math.round(sp.price * config.rentRate);
    if (ownsFullSet(state, owner, sp.chapter)) rent *= config.setMultiplier;
    return rent;
  }
  function netWorth(state, teamId) {
    const t = teamById(state, teamId);
    let total = t.cash;
    for (const [i, owner] of Object.entries(state.owners)) {
      if (owner === teamId) total += spaces[i].price;
    }
    return total;
  }
  function standings(state) {
    return state.teams
      .map((t) => ({ teamId: t.id, name: t.name, cash: t.cash, netWorth: netWorth(state, t.id), spaces: Object.values(state.owners).filter((o) => o === t.id).length }))
      .sort((a, b) => b.netWorth - a.netWorth);
  }

  function log(state, text) { state.log.push({ round: state.round, text }); }

  function createGame({ teams, timeLimitMinutes, seed = 1, now = 0 }) {
    if (teams.length < config.minTeams || teams.length > config.maxTeams) {
      throw new Error(`Teams must be ${config.minTeams} to ${config.maxTeams}`);
    }
    const state = {
      phase: PHASES.ROLL,
      rng: seed >>> 0,
      now,
      endsAt: now + (timeLimitMinutes ?? config.defaultTimeLimitMinutes) * 60000,
      round: 1,
      turn: 0,
      teams: teams.map((t, k) => ({
        id: t.id ?? `t${k + 1}`, name: t.name, color: t.color, pawn: t.pawn,
        cash: config.startCash, pos: LAUNCH_INDEX, inRecall: false
      })),
      owners: {},
      dice: null,
      move: null,
      pending: null,
      question: null,   // { id, deadline }
      answers: {},      // teamId -> option index (hidden until reveal)
      result: null,
      asked: [],
      decks: {},
      log: []
    };
    for (const [name, cards] of Object.entries(config.decks)) {
      state.decks[name] = { order: shuffle(state, cards.map((_, i) => i)), next: 0 };
    }
    log(state, 'Game started.');
    return state;
  }

  function startQuestion(state, qid, now) {
    state.phase = PHASES.QUESTION;
    state.question = { id: qid, deadline: now + config.questionSeconds * 1000 };
    state.answers = {};
    if (!state.asked.includes(qid)) state.asked.push(qid);
  }

  function pickExtraQuestion(state, chapter) {
    const pool = questions.filter((q) => (chapter ? q.chapter === chapter : true));
    const fresh = pool.filter((q) => !state.asked.includes(q.id));
    const from = fresh.length ? fresh : pool;
    return from[randInt(state, from.length)].id;
  }

  function finishTurn(state, result) {
    state.phase = PHASES.RESULT;
    state.result = result;
    state.pending = null;
  }

  function pay(state, fromTeam, toTeamId, amount) {
    const paid = Math.min(Math.max(amount, 0), fromTeam.cash);
    fromTeam.cash -= paid;
    if (toTeamId) teamById(state, toTeamId).cash += paid;
    return paid;
  }

  function drawCard(state, deckName) {
    const d = state.decks[deckName];
    const cards = config.decks[deckName];
    const card = cards[d.order[d.next % d.order.length]];
    d.next += 1;
    return card;
  }

  function resolveLanding(state, now) {
    const team = activeTeam(state);
    const sp = spaces[team.pos];
    switch (sp.kind) {
      case 'launch':
        log(state, `${team.name} landed on Launch.`);
        return finishTurn(state, { kind: 'launch', space: sp.i });
      case 'study':
        log(state, `${team.name} took a Study Break.`);
        return finishTurn(state, { kind: 'study', space: sp.i });
      case 'recall':
        log(state, `${team.name} is just visiting Product Recall.`);
        return finishTurn(state, { kind: 'visitRecall', space: sp.i });
      case 'goToRecall':
        team.pos = RECALL_INDEX;
        team.inRecall = true;
        log(state, `${team.name} was sent to Product Recall.`);
        return finishTurn(state, { kind: 'goToRecall', space: sp.i });
      case 'card': {
        const card = drawCard(state, sp.deck);
        const e = card.effect;
        let detail = {};
        if (e.type === 'cash') {
          if (e.amount >= 0) team.cash += e.amount;
          else detail.paid = pay(state, team, null, -e.amount);
        } else if (e.type === 'advanceToLaunch') {
          team.pos = LAUNCH_INDEX;
          team.cash += config.launchBonus;
        } else if (e.type === 'goToRecall') {
          team.pos = RECALL_INDEX;
          team.inRecall = true;
        }
        log(state, `${team.name} drew: ${card.text}`);
        return finishTurn(state, { kind: 'card', deck: sp.deck, card, ...detail });
      }
      case 'question': {
        const owner = state.owners[sp.i];
        if (owner === undefined) {
          if (team.cash < sp.price) {
            log(state, `${team.name} cannot afford ${sp.name} ($${sp.price}).`);
            return finishTurn(state, { kind: 'cantAfford', space: sp.i, price: sp.price });
          }
          state.pending = { kind: 'offer', space: sp.i };
          state.phase = PHASES.OFFER;
          return state;
        }
        if (owner === team.id) {
          log(state, `${team.name} owns ${sp.name}. Nothing happens.`);
          return finishTurn(state, { kind: 'ownSpace', space: sp.i });
        }
        state.pending = { kind: 'defend', space: sp.i, owner, rent: rentFor(state, sp.i) };
        return startQuestion(state, pickExtraQuestion(state, sp.chapter), now);
      }
      default:
        throw new Error(`Unknown space kind ${sp.kind}`);
    }
  }

  function applyOutcome(state, correct) {
    const team = activeTeam(state);
    const q = qById[state.question.id];
    const reveal = {
      questionId: q.id,
      correctAnswer: q.type === 'blank' ? q.answerText : q.options[q.answerIndex],
      explanation: q.explanation,
      teamAnswers: { ...state.answers }
    };
    const p = state.pending;
    if (p.kind === 'buy') {
      const sp = spaces[p.space];
      if (correct) {
        team.cash -= sp.price;
        state.owners[p.space] = team.id;
        const setComplete = ownsFullSet(state, team.id, sp.chapter);
        log(state, `${team.name} answered correctly and bought ${sp.name} for $${sp.price}.${setComplete ? ` Chapter complete: ${config.chapters[sp.chapter].name}!` : ''}`);
        return finishTurn(state, { kind: 'bought', correct, space: p.space, price: sp.price, setComplete, reveal });
      }
      log(state, `${team.name} missed the question. ${sp.name} stays on the market.`);
      return finishTurn(state, { kind: 'missedBuy', correct, space: p.space, reveal });
    }
    if (p.kind === 'defend') {
      const sp = spaces[p.space];
      if (correct) {
        log(state, `${team.name} defended the rent on ${sp.name}. Nothing paid.`);
        return finishTurn(state, { kind: 'defended', correct, space: p.space, owner: p.owner, reveal });
      }
      const paid = pay(state, team, p.owner, p.rent);
      log(state, `${team.name} missed the question and paid $${paid} rent to ${teamById(state, p.owner).name}.`);
      return finishTurn(state, { kind: 'rentPaid', correct, space: p.space, owner: p.owner, rent: p.rent, paid, reveal });
    }
    if (p.kind === 'escape') {
      if (correct) {
        team.inRecall = false;
        state.pending = null;
        state.question = null;
        state.answers = {};
        state.phase = PHASES.ROLL;
        state.escaped = { reveal };
        log(state, `${team.name} answered correctly and left Product Recall. Roll the dice.`);
        return state;
      }
      // A wrong answer costs the turn but releases the team (same outcome as waiting).
      team.inRecall = false;
      log(state, `${team.name} missed the question, misses this turn and leaves Product Recall.`);
      return finishTurn(state, { kind: 'recallMissed', correct, reveal });
    }
    throw new Error('Unknown pending kind');
  }

  function allLockedIn(state) {
    return state.teams.every((t) => state.answers[t.id] !== undefined);
  }

  function reduce(prev, action) {
    const state = clone(prev);
    if (action.now !== undefined) state.now = action.now;
    const team = activeTeam(state);

    switch (action.type) {
      case 'ROLL': {
        if (state.phase !== PHASES.ROLL) throw new Error('Not the roll step');
        if (team.inRecall) throw new Error('Team is in Recall: choose to answer or wait');
        state.escaped = null;
        const d = action.dice ?? [1 + randInt(state, 6), 1 + randInt(state, 6)];
        const sum = d[0] + d[1];
        const from = team.pos;
        const raw = from + sum;
        const to = raw % N;
        if (raw >= N) {
          team.cash += config.launchBonus;
          log(state, `${team.name} passed Launch and collected $${config.launchBonus}.`);
        }
        team.pos = to;
        state.dice = d;
        state.move = { from, to, steps: sum, passedLaunch: raw >= N };
        state.phase = PHASES.MOVE;
        log(state, `${team.name} rolled ${d[0]} + ${d[1]} = ${sum} and moved to ${spaces[to].name}.`);
        return state;
      }
      case 'MOVE_DONE': {
        if (state.phase !== PHASES.MOVE) throw new Error('Not the move step');
        resolveLanding(state, state.now);
        return state;
      }
      case 'BUY_CHOICE': {
        if (state.phase !== PHASES.OFFER) throw new Error('No offer to answer');
        const sp = spaces[state.pending.space];
        if (action.buy) {
          state.pending = { kind: 'buy', space: sp.i };
          startQuestion(state, qBySpace[sp.i], state.now);
          return state;
        }
        log(state, `${team.name} chose not to try for ${sp.name}. It stays on the market.`);
        finishTurn(state, { kind: 'declined', space: sp.i });
        return state;
      }
      case 'RECALL_CHOICE': {
        if (state.phase !== PHASES.ROLL || !team.inRecall) throw new Error('Team is not choosing in Recall');
        if (action.choice === 'wait') {
          team.inRecall = false;
          log(state, `${team.name} waited out a turn and leaves Product Recall.`);
          finishTurn(state, { kind: 'recallWait' });
          return state;
        }
        if (action.choice === 'answer') {
          state.pending = { kind: 'escape' };
          startQuestion(state, pickExtraQuestion(state, null), state.now);
          return state;
        }
        throw new Error('Choice must be answer or wait');
      }
      case 'SUBMIT_ANSWER': {
        if (state.phase !== PHASES.QUESTION) throw new Error('No open question');
        if (!teamById(state, action.teamId)) throw new Error('Unknown team');
        const q = qById[state.question.id];
        if (q.type === 'blank') {
          // Fill-in-the-blank is judged by the host; phones just mark "locked in".
          state.answers[action.teamId] = -1;
        } else {
          if (!Number.isInteger(action.answer) || action.answer < 0 || action.answer >= q.options.length) throw new Error('Invalid option');
          state.answers[action.teamId] = action.answer;
        }
        return state;
      }
      case 'REVEAL': {
        if (state.phase !== PHASES.QUESTION) throw new Error('Nothing to reveal');
        const q = qById[state.question.id];
        if (q.type === 'blank') {
          state.phase = PHASES.JUDGE;
          return state;
        }
        const correct = state.answers[team.id] === q.answerIndex;
        applyOutcome(state, correct);

      }
      case 'JUDGE': {
        if (state.phase !== PHASES.JUDGE) throw new Error('Not judging');
        applyOutcome(state, !!action.correct);
        return state;
      }
      case 'NEXT_TEAM': {

            return state;
          }
        }
        state.phase = PHASES.ROLL;
        return state;
      }
      case 'END_NOW': {
        state.phase = PHASES.ENDED;
        state.final = standings(state);
        return state;
      }

        throw new Error(`Unknown action ${action.type}`);

  // ---- Guided UX selector -------------------------------------------------
  // Tells the UI what to show and which single host control is enabled.
  function nextStep(state, now = state.now) {
    const team = state.teams[state.turn];
    const enabled = { buyYes: false, buyNo: false, roll: false, recallAnswer: false, recallWait: false, reveal: false, judgeCorrect: false, judgeWrong: false, nextTeam: false };
    const name = team.name;
    switch (state.phase) {
      case PHASES.ROLL:
        if (team.inRecall) {
          enabled.recallAnswer = true; enabled.recallWait = true;
          return { step: 1, of: 4, auto: false, enabled, banner: `${name} is in Product Recall: answer a question to escape, or wait a turn.` };
        }
        enabled.roll = true;
        return { step: 1, of: 4, auto: false, enabled, banner: state.escaped ? `${name} is free! Press ROLL DICE.` : `${name}: press ROLL DICE to move.` };
      case PHASES.MOVE:
        return { step: 2, of: 4, auto: true, enabled, banner: `${name} is moving to ${spaces[team.pos].name}...` };
      case PHASES.OFFER:
        enabled.buyYes = true; enabled.buyNo = true;
        return { step: 3, of: 4, auto: false, enabled, banner: `${name}: try to buy ${spaces[state.pending.space].name} for $${spaces[state.pending.space].price}? Choose YES or NO.` };
      case PHASES.QUESTION: {
        const ready = allLockedIn(state) || now >= state.question.deadline;
        enabled.reveal = ready;
        const locked = Object.keys(state.answers).length;
        return {
          step: 3, of: 4, auto: false, enabled,
          banner: ready ? 'Time to reveal. Press REVEAL.' : 'Everyone: pick an answer on your phone and press Lock in.',
          progress: { locked, teams: state.teams.length }
        };
      }
      case PHASES.JUDGE:
        enabled.judgeCorrect = true; enabled.judgeWrong = true;
        return { step: 3, of: 4, auto: false, enabled, banner: `Host: did ${name} answer correctly? Tap CORRECT or WRONG.` };
      case PHASES.RESULT:

        return { step: 4, of: 4, auto: false, enabled, banner: `${resultSummary(state)} Press NEXT TEAM.` };
      case PHASES.ENDED:

  function resultSummary(state) {

      case 'bought': return `${name} bought ${sp} for $${r.price}.`;
      case 'missedBuy': return `${name} missed it. ${sp} stays on the market.`;
      case 'defended': return `${name} defended the rent. Nothing paid.`;
      case 'rentPaid': return `${name} paid $${r.paid} rent.`;
      case 'declined': return `${name} chose not to buy ${sp}. It stays on the market.`;
      case 'cantAfford': return `${name} cannot afford ${sp}.`;
      case 'ownSpace': return `${name} already owns ${sp}.`;
      case 'launch': return `${name} is on Launch.`;
      case 'study': return `${name} takes a Study Break.`;
      case 'visitRecall': return `${name} is just visiting Recall.`;
      case 'goToRecall': return `${name} goes to Product Recall.`;
      case 'card': return r.card.text;
      case 'recallWait': return `${name} waits a turn and leaves Recall.`;

  // until the result step.
  function phoneView(state, teamId, now = state.now) {

      round: state.round,
      activeTeamId: activeTeam(state).id,
      you: { id: t.id, name: t.name, cash: t.cash, pos: t.pos, inRecall: t.inRecall, netWorth: netWorth(state, t.id), deeds: Object.entries(state.owners).filter(([, o]) => o === t.id).map(([i]) => Number(i)) },
      question: null,
      result: null
    };
    if (state.phase === PHASES.QUESTION && q) {
      view.question = {
        id: q.id, type: q.type, prompt: q.prompt, options: q.options ?? null,
        deadline: state.question.deadline, secondsLeft: Math.max(0, Math.ceil((state.question.deadline - now) / 1000)),
        lockedIn: state.answers[teamId] !== undefined,
        yourAnswer: state.answers[teamId] !== undefined && state.answers[teamId] >= 0 ? state.answers[teamId] : null

    }
    if (state.phase === PHASES.RESULT && state.result) {
      view.result = { kind: state.result.kind, summary: resultSummary(state), reveal: state.result.reveal ?? null };
    }
    return view;
  }

  return { createGame, reduce, nextStep, phoneView, rentFor, netWorth, standings, ownsFullSet, qBySpace, resultSummary };
}

function loadAbly() {

    const s = document.createElement('script');

}

  onstatus(ABLY_KEY ? 'connecting' : 'local');
  if (ABLY_KEY) {
    const timer = setTimeout(() => { if (!ch) onstatus('offline'); }, 9000);
    loadAbly().then((Ably) => {
      const client = new Ably.Realtime({ key: ABLY_KEY, echoMessages: false });
      client.connection.on((c) => onstatus(c.current === 'connected' ? 'live' : c.current));
      ch = client.channels.get('mogul:' + code);
      ch.subscribe('m', (m) => { if (m && m.data && typeof m.data === 'object') onmsg(m.data); });
      clearTimeout(timer);
      queue.splice(0).forEach((m) => ch.publish('m', m));
    }).catch(() => { clearTimeout(timer); onstatus('offline'); });
  }
  return {
    send(m) {
      if (bc) { try { bc.postMessage(m); } catch { /* ignore */ } }
      if (ch) { try { ch.publish('m', m); } catch { /* ignore */ } } else if (ABLY_KEY && queue.length < 30) queue.push(m);
    }
  };
}

/* ---- clicks ---- */
$stage.addEventListener('input', (e) => { const i = e.target.dataset && e.target.dataset.name; if (i !== undefined) S.names[Number(i)] = e.target.value; });
$stage.addEventListener('click', (e) => {

function startGame() {

}

const P = { code: '', device: null, seat: null, snap: null, recv: 0, sel: null, sent: {}, net: null, helloTimer: null, since: 0, error: '' };
function phoneInit() {

}

function phoneConnect() {

}

    let body;
    if (q.type === 'blank') {
      body = `<div class="ph-q">${esc(q.prompt)}</div><div class="ph-sub">Talk it over with your team and say the answer out loud. The instructor judges it. Press the button when your team is ready.</div><button class="ph-btn" data-p="lock" data-key="${key}" data-i="-1" ${locked ? 'disabled' : ''}>${locked ? 'LOCKED IN' : 'WE HAVE AN ANSWER'}</button>`;
    } else {
      const sel = P.sel && P.sel.key === key ? P.sel.i : null;
      const yours = q.yourAnswer;
      body = `<div class="ph-q">${esc(q.prompt)}</div>` + q.options.map((o, i) => `<button class="ph-opt${(locked ? yours === i : sel === i) ? ' sel' : ''}" data-p="pick" data-key="${key}" data-i="${i}" ${locked ? 'disabled' : ''}><i>${q.type === 'tf' ? (i === 0 ? 'T' : 'F') : LETTERS[i]}</i><span>${esc(o)}</span></button>`).join('')
        + `<button class="ph-btn" data-p="lock" data-key="${key}" data-i="${sel === null ? '' : sel}" ${locked || sel === null ? 'disabled' : ''}>${locked ? 'LOCKED IN. WAITING FOR THE REVEAL' : (sel === null ? 'PICK AN ANSWER' : 'LOCK IN: ' + (q.type === 'tf' ? (sel === 0 ? 'TRUE' : 'FALSE') : LETTERS[sel]))}</button>`;
    }
    const note = act ? 'Your team is on turn. Your answer counts.' : `Only ${esc(v.activeName)} is scored on this one. Answer anyway to test yourself.`;
    const left = Math.max(0, q.secondsLeft - (Date.now() - P.recv) / 1000);
    root.innerHTML = `${phTop(mine, cash)}<div class="ph-card"><div class="h"><small>${act ? 'Your turn' : esc(v.activeName) + ' is on turn'}</small><b>${q.type === 'tf' ? 'True or false' : (q.type === 'mc' ? 'Multiple choice' : 'Fill in the blank')}</b></div><div class="b">${body}<div id="pt"><b style="font-family:var(--display);font-size:22px">${Math.ceil(left)}s</b><div class="ph-timer" style="margin-top:4px"><div style="width:${100 * left / CFG.questionSeconds}%"></div></div></div></div></div><div class="ph-note">${note}</div>`;
    return;
  }
  if (s.phase === 'result' && v.result) {
    const rv = v.result.reveal;
    let verdict = '';
    if (v.youCorrect === true) verdict = '<div class="ph-big" style="color:var(--good)">You got it right</div>';
    else if (v.youCorrect === false) verdict = '<div class="ph-big" style="color:var(--bad)">Not this time</div>';
    const ans = rv ? `<div class="ph-sub"><b>Answer:</b> ${esc(rv.correctAnswer)}</div><div class="ph-sub">${esc(rv.explanation)}</div>` : '';
    const tally = v.result.tally ? `<div class="ph-sub"><b>${v.result.tally.right} of ${v.result.tally.total}</b> teams got it right.</div>` : '';
    root.innerHTML = `${phTop(mine, cash)}<div class="ph-card"><div class="h"><small>${act ? 'Your result' : 'Result for ' + esc(v.activeName)}</small><b>Result</b></div><div class="b">${verdict}<div class="ph-sub" style="font-weight:700">${esc(v.result.summary)}</div>${ans}${tally}</div></div><div class="ph-note">Watch the big screen. The instructor presses Next team.</div>`;
    return;
  }
  const msg = { roll: act ? 'Your turn. Look at the big screen: the instructor rolls the dice.' : `${esc(v.activeName)} is about to roll.`, move: `${esc(v.activeName)} is moving.`, judge: 'The instructor is judging the answer.', landed: `${esc(v.activeName)} has landed. Watch the big screen. The question comes next.`, question: 'Get ready.', offer: `${esc(v.activeName)} is deciding whether to try to buy the space.`, result: '' }[s.phase] || '';
  const deeds = v.you.deeds.length;
  root.innerHTML = `${phTop(mine, cash)}<div class="ph-card"><div class="h"><small>Round ${s.round}</small><b>${act ? 'Your turn' : esc(v.activeName) + ' is on turn'}</b></div><div class="b"><div class="ph-sub">${msg}</div><div class="ph-sub"><b>${deeds}</b> space${deeds === 1 ? '' : 's'} owned · worth <b>${money(v.you.netWorth)}</b></div>${v.you.inRecall ? '<div class="ph-sub" style="color:var(--bad);font-weight:700">Your team is in Product Recall.</div>' : ''}</div></div>`;
}
document.addEventListener('click', (e) => {
  if (!isPhone) return;
  const b = e.target.closest('[data-p]'); if (!b || b.disabled) return;
  const a = b.dataset.p;
  if (a === 'code') { const val = ($('codein').value || '').toUpperCase().replace(/[^A-Z]/g, ''); if (val.length === 4) { P.code = val; P.error = ''; P.seat = null; phoneSave(); phoneConnect(); phoneRender(); } }
  else if (a === 'change') { P.code = ''; P.snap = null; P.seat = null; P.error = ''; clearInterval(P.helloTimer); phoneSave(); phoneRender(); }
  else if (a === 'claim') { P.seat = b.dataset.seat; phoneSave(); P.net.send({ t: 'claim', seat: P.seat, device: P.device }); }
  else if (a === 'leave') { P.net.send({ t: 'release', seat: P.seat, device: P.device }); P.seat = null; phoneSave(); phoneRender(); }
  else if (a === 'pick') { P.sel = { key: b.dataset.key, i: Number(b.dataset.i) }; phoneRender(); }
  else if (a === 'lock') {
    const i = Number(b.dataset.i); const key = b.dataset.key;
    if (b.dataset.i === '') return;
    P.sent[key] = true; P.net.send({ t: 'answer', seat: P.seat, device: P.device, answer: i }); phoneRender();
  }
});
document.addEventListener('keydown', (e) => { if (isPhone && e.key === 'Enter' && document.activeElement && document.activeElement.id === 'codein') { document.activeElement.blur(); const b = document.querySelector('[data-p="code"]'); if (b) b.click(); } });

/* ===================== start ===================== */
if (isPhone) phoneInit();
else { fit(); render(); }
</script>
</body>
</html>
