<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Mogul: Star Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1026; --navy2:#141B3F; --navy3:#1C2552; --cream:#F4EDDC; --ink:#0B1026; --red:#C8282D; --yellow:#FFD23F; --mute:#C9CEE8; --good:#7BE495; --bad:#FF5A5F;
  --a:#FF5A5F; --b:#FFD23F; --c:#4CC9F0; --d:#7BE495;
  --display:'Alfa Slab One',Georgia,serif; --body:'Rubik',system-ui,Arial,sans-serif; --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background-color:var(--navy);background-image:radial-gradient(#fff 1px,transparent 1.6px),radial-gradient(#9FB0FF 1px,transparent 1.6px);background-size:150px 150px,97px 97px;background-position:0 0,43px 61px;color:var(--cream);font-family:var(--body);overflow:hidden}
button{font-family:var(--body);cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
.disp{font-family:var(--display);font-weight:400}
.cond{font-family:var(--cond);font-weight:700;letter-spacing:2px;text-transform:uppercase}
#net{position:fixed;left:10px;bottom:4px;font-size:15px;color:var(--mute);z-index:50;pointer-events:none}
/* ---------- projector ---------- */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;padding:26px 40px 30px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;gap:20px;flex:none;height:78px}
.logo{display:flex;align-items:center;gap:16px}
.logo .b{background:var(--red);border:3px solid var(--cream);padding:6px 16px;font-family:var(--display);font-size:27px;white-space:nowrap}
.logo .s{font-family:var(--cond);font-weight:700;font-size:24px;letter-spacing:3px;color:var(--yellow);white-space:nowrap}
.wave{flex:1;min-width:0;padding-left:24px;display:flex;align-items:center;justify-content:center;gap:14px}
.wave .n{font-family:var(--cond);font-weight:700;font-size:32px;letter-spacing:2px;white-space:nowrap}
.chip{background:var(--yellow);color:var(--ink);font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:2px;padding:3px 16px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.clock{display:flex;align-items:center;gap:14px}
.clock small{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:2px;text-align:right;line-height:1.1;max-width:120px}
.clock b{font-family:var(--display);font-weight:400;font-size:50px;color:var(--yellow);min-width:90px;text-align:right}
.tools{display:flex;gap:10px}
.tools button,.fab button{font:700 18px var(--body);background:var(--yellow);color:var(--ink);border:3px solid var(--cream);border-radius:999px;padding:5px 13px;white-space:nowrap}
.tools button.end{background:transparent;color:var(--cream)}
.fab{position:absolute;top:14px;right:20px;display:flex;gap:10px;z-index:9}
.cols{flex:1;min-height:0;display:flex;gap:30px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;min-height:0}
.side{width:430px;flex:none;display:flex;flex-direction:column;gap:18px;min-height:0}
.panel{background:var(--navy2);border:3px solid var(--cream);border-radius:16px;padding:20px 22px}
.panel h2{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:30px}
.lb{flex:1;min-height:0;display:flex;flex-direction:column}
.lbrows{overflow:auto;display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px}
.row:nth-child(odd){background:var(--navy3)}
.row .rk{width:34px;font-family:var(--display);font-size:26px;color:var(--yellow)}
.row .nm{flex:1;min-width:0;font-size:28px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sc{font-family:var(--display);font-size:28px;text-align:right}
.row .gn{display:block;font-size:20px;color:var(--good);font-weight:700;text-align:right;font-family:var(--body)}
.qcard{background:var(--cream);color:var(--ink);border:5px solid var(--ink);border-radius:18px;padding:22px 34px;box-shadow:8px 8px 0 var(--red);flex:none;overflow:auto}
.qcard .k{font-family:var(--cond);font-weight:700;font-size:28px;letter-spacing:3px;color:var(--red)}
.qcard .k.g{color:#1E7B3F}
.opts{flex:1;min-height:0;overflow:auto;display:grid;gap:18px;align-content:start;padding:4px 6px 10px 0}
.opt{position:relative;display:flex;align-items:center;gap:18px;background:var(--cream);color:var(--ink);border:5px solid var(--ink);border-radius:16px;padding:14px 20px;min-height:110px}
.opt .al{flex:none;width:110px;display:flex;justify-content:center}
.opt .ltr{flex:none;width:56px;height:56px;border-radius:50%;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:28px}
.opt .tx{flex:1;font-weight:700;line-height:1.15}
.opt.dim{opacity:.38}
.opt.hit{border-color:#1E7B3F;box-shadow:0 0 0 6px var(--good)}
.opt .ct{flex:none;font-family:var(--display);font-size:34px;text-align:right}
.opt .ct small{display:block;font-family:var(--body);font-size:20px;font-weight:600}
.btn{display:block;width:100%;min-height:92px;border:5px solid var(--cream);border-radius:16px;background:var(--red);color:#fff;font-size:34px;font-weight:700;letter-spacing:1px;box-shadow:0 6px 0 #000}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{background:#2A3260;color:#8C94BE;box-shadow:none}
.btn.alt{background:var(--navy2);color:var(--cream)}
.btn.sm{min-height:60px;font-size:24px}
.btn.go{background:#1E7B3F}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.big{font-family:var(--display);font-size:92px;line-height:1.05}
.sub{font-size:34px;line-height:1.35;color:var(--mute)}
.screen{flex:1;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding-top:30px}
.lbl{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:3px;text-transform:uppercase;margin:20px 0 8px;color:var(--yellow)}
.pill{display:flex;border:3px solid var(--cream);border-radius:14px;overflow:hidden;width:max-content}
.pill button{font:700 30px var(--body);padding:12px 26px;background:var(--navy2);color:var(--cream);border:0;border-right:3px solid var(--cream)}
.pill button:last-child{border-right:0}
.pill button.on{background:var(--yellow);color:var(--ink)}
.code{font-family:var(--display);font-size:150px;letter-spacing:22px;color:var(--yellow);margin:6px 0 0 22px;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:10px;overflow:auto;max-height:520px;align-content:flex-start}
.pchip{display:flex;align-items:center;gap:8px;background:var(--navy3);border-radius:999px;padding:6px 16px 6px 10px;font-size:26px;font-weight:500}
.fxslot{flex:1;min-height:0;position:relative;border:3px solid var(--cream);border-radius:16px;overflow:hidden;background:#070B1E}
.fxslot canvas{position:absolute;inset:0;width:100%;height:100%}
.fxslot .ov{position:absolute;left:0;right:0;top:24px;text-align:center;font-family:var(--display);font-size:64px;color:var(--cream);text-shadow:4px 4px 0 var(--red);z-index:2}
.fxslot .ov2{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-family:var(--cond);font-weight:700;font-size:34px;letter-spacing:3px;color:var(--yellow);z-index:2}
.bars{display:flex;flex-direction:column;gap:12px;overflow:auto}
.bar{display:flex;align-items:center;gap:16px;font-size:30px}
.bar .n{width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t{flex:1;height:30px;background:var(--navy);border:2px solid var(--cream);border-radius:15px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--yellow)}
.bar .v{width:90px;text-align:right;font-family:var(--display)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:26px;margin-top:10px}
.pod{width:330px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pod .blk{width:100%;border:5px solid var(--cream);border-bottom:0;border-radius:16px 16px 0 0;background:var(--navy2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:18px;font-family:var(--display);font-size:80px}
.pod .pn{font-size:36px;font-weight:700;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .ps{font-family:var(--display);font-size:38px;color:var(--yellow)}
.table{width:100%;overflow:auto}
.table .row{font-size:26px}
kbd{display:inline-block;min-width:1.7em;padding:.05em .45em;margin:0 .12em;border:2px solid var(--cream);border-bottom-width:4px;border-radius:.35em;background:var(--navy3);font:700 .95em var(--body);text-align:center;color:var(--cream)}
.hd{font-family:var(--cond);font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--yellow);font-size:1.05em;margin-top:.55em}
.hd:first-child{margin-top:0}
.ht{color:var(--cream)}
.ph-card .hd{color:var(--red)}
.ph-card .ht{color:#222}
.ph-card kbd,.ph-note kbd{color:var(--ink);background:#fff;border-color:var(--ink)}
.ph-note kbd{color:var(--cream);background:var(--navy3);border-color:var(--cream)}
.lbbig{flex:1;min-height:0;display:flex;padding:14px 18px}
.lbgrid{flex:1;display:grid;grid-auto-flow:column;column-gap:36px;row-gap:4px;min-height:0}
.lrow{display:flex;align-items:center;gap:14px;padding:0 14px;border-radius:12px;background:var(--navy3);min-height:0;overflow:hidden}
.lrow .rk{width:1.5em;font-family:var(--display);color:var(--yellow)}
.lrow .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .pr{width:18%;max-width:220px;height:.45em;border:2px solid var(--cream);border-radius:99px;background:var(--navy);overflow:hidden;flex:none}
.lrow .pr i{display:block;height:100%;background:var(--yellow);transition:width .6s}
.lrow .wv{width:3.4em;font-size:.62em;color:var(--mute);text-align:right;flex:none}
.lrow .sc{width:3.4em;font-family:var(--display);text-align:right;flex:none}
.lrow .gs{width:4em;font-size:.6em;font-weight:700;text-align:right;flex:none;white-space:nowrap}
#phone>*{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
/* ---------- phone ---------- */
#phone{position:absolute;inset:0;overflow:auto;display:none;flex-direction:column;-webkit-overflow-scrolling:touch}
.ph-top{position:sticky;top:0;z-index:5;background:var(--navy);border-bottom:3px solid var(--cream);padding:10px 14px 8px;display:flex;flex-direction:column;gap:6px}
.ph-top .r{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph-top .w{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:2px;text-transform:uppercase}
.ph-top .t{font-family:var(--display);font-size:28px;color:var(--yellow)}
.ph-top .sc{font-family:var(--display);font-size:22px}
.bar2{height:10px;border-radius:6px;background:var(--navy2);border:2px solid var(--cream);overflow:hidden}
.bar2 div{height:100%;background:var(--yellow)}
.ph-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.ph-card{background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:14px;padding:14px 16px;box-shadow:5px 5px 0 var(--red)}
.ph-card .k{font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:2px;color:var(--red);text-transform:uppercase}
.ph-q{font-weight:700;line-height:1.25}
.ph-opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:14px;padding:10px 14px;min-height:64px;box-shadow:0 4px 0 #000;width:100%}
.ph-opt:active{transform:translateY(2px)}
.ph-opt .l{flex:none;width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px}
.ph-opt .x{flex:1;font-weight:700;line-height:1.15}
.ph-opt.sel{background:var(--yellow)}
.ph-opt.ok{border-color:#1E7B3F;background:#D7F5DF}
.ph-opt.no{background:#FFD9D9;border-color:#B3261E}
.ph-opt.off{opacity:.5;box-shadow:none}
.ph-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;min-height:56px;width:100%;background:var(--red);color:#fff;border:4px solid var(--cream);border-radius:14px;font-weight:700;font-size:20px;letter-spacing:1px;padding:8px 12px}
.ph-btn.alt{background:var(--navy2);color:var(--yellow);border:3px dashed var(--yellow);font-family:var(--cond);font-size:22px;letter-spacing:2px;text-transform:uppercase}
.ph-btn.alt.on{background:var(--yellow);color:var(--ink);border-style:solid}
.ph-btn:disabled{opacity:.5}
.ph-in{width:100%;font-family:var(--display);font-size:34px;text-align:center;text-transform:uppercase;padding:12px;border:4px solid var(--cream);border-radius:14px;background:var(--navy2);color:var(--cream);letter-spacing:6px}
.ph-in.name{font-family:var(--body);font-weight:700;font-size:26px;letter-spacing:0;text-transform:none}
.ph-big{font-family:var(--display);font-size:34px;line-height:1.1}
.ph-sub{font-size:18px;line-height:1.4;color:var(--mute)}
.ph-note{text-align:center;font-size:15px;color:var(--mute);padding:6px 14px 20px}
.arena{position:relative;flex:1;min-height:360px;touch-action:none}
.arena canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;left:12px;top:10px;font-family:var(--display);font-size:30px;color:var(--cream);text-shadow:3px 3px 0 var(--red);pointer-events:none}
.hud small{font-family:var(--cond);font-size:18px;letter-spacing:2px;display:block;color:var(--yellow);text-shadow:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="phone"></div>
<div id="net"></div>
<script>
/* ===================== data ===================== */
const QS_ALL = {
  "_note": "chapter + price decide which board space a question belongs to. 'weakFit' marks questions whose chapter is a judgement call: please review. 'deckSlide' is the question slide in Marketing_Jeopardy__Exam_4_.pptx. Question text and answers come from the deck; explanations are drafts for review.",
  "questions": [
    {"id":"q01","chapter":"research","price":200,"deckSlide":21,"type":"tf","prompt":"A Marketing Information System (MIS) helps organizations gather, analyze, and distribute data that supports marketing decision-making.","options":["True","False"],"answerIndex":0,"explanation":"An MIS collects, analyzes and distributes information so managers can make marketing decisions."},
    {"id":"q02","chapter":"research","price":400,"deckSlide":23,"type":"blank","prompt":"The first step in the marketing research process is to _________, which ensures the research addresses the correct problem or opportunity.","answerText":"Define the problem or opportunity","explanation":"Research starts by defining the problem or opportunity; otherwise the study can answer the wrong question."},
    {"id":"q03","chapter":"research","price":600,"deckSlide":25,"type":"mc","prompt":"A company wants to use qualitative research techniques, including focus groups and in-depth interviews, to explore consumer feelings and opinions. However, it is still struggling to define the exact problem to carry out an in-depth study. What type of research is the company conducting?","options":["Descriptive","Causal","Exploratory","Quantitative"],"answerIndex":2,"explanation":"Exploratory research uses qualitative methods to clarify a problem that is not yet well defined."},
    {"id":"q04","chapter":"research","price":800,"deckSlide":37,"type":"mc","prompt":"A global apparel brand notices a decline in sales and wants to understand if a change in price or product features would lead to higher customer satisfaction and increased purchases. The company conducts an experiment, offering different pricing and feature combinations to two separate customer groups, while controlling all other variables. What type of research design is this company using?","options":["Exploratory Research","Descriptive Research","Causal (Experimental) Research","Observational Research"],"answerIndex":2,"explanation":"Causal (experimental) research changes one variable while controlling the others to test cause and effect.","note":"Deck had this in the second block; placed in Research."},
    {"id":"q05","chapter":"research","price":1000,"deckSlide":29,"type":"blank","prompt":"A multinational beverage company launches a new energy drink but fails to gain market share. In its post-launch review, it discovers that poor sampling in its pre-launch surveys led to data that didn't accurately reflect the target market's preferences. This error in the _________ selection step of the marketing research process resulted in _________ error, ultimately causing a failed launch.","answerText":"Sample; Sampling","explanation":"A sample that does not represent the target market creates sampling error, which makes the results unreliable."},

    {"id":"q06","chapter":"message","price":200,"deckSlide":31,"type":"mc","prompt":"Which of the following is NOT considered part of the promotional mix in IMC?","options":["Advertising","Public Relations","Direct Marketing","Product Development"],"answerIndex":3,"explanation":"The promotional mix is how a firm communicates; product development belongs to the product side of the marketing mix."},
    {"id":"q07","chapter":"message","price":400,"deckSlide":51,"type":"mc","prompt":"In a communication process, which of the following factors is not the cause of interference?","options":["Poor Reception","Poor Print Quality","Problems with server","None of the above"],"answerIndex":3,"explanation":"Interference (noise) is anything that distorts a message. All three listed causes qualify, so 'none of the above' is correct."},
    {"id":"q08","chapter":"message","price":600,"deckSlide":61,"type":"mc","prompt":"A company launches two advertising campaigns for its new luxury electric car. Campaign A emphasizes the advanced battery technology, superior mileage, and cost savings over time. Campaign B highlights the feeling of prestige, freedom, and environmental pride owners will experience. Which statement BEST describes the primary communication appeals used in these campaigns?","options":["Campaign A uses an emotional appeal, while Campaign B uses a rational appeal.","Both Campaign A and Campaign B use rational appeals, but focus on different features.","Campaign A uses a rational appeal, focusing on logical benefits, while Campaign B uses an emotional appeal, targeting feelings and status.","Campaign A uses an emotional appeal by focusing on technology, and Campaign B uses a rational appeal by focusing on environmental benefits."],"answerIndex":2,"explanation":"Rational appeals argue with facts and benefits; emotional appeals target feelings such as prestige and pride."},
    {"id":"q09","chapter":"message","price":800,"deckSlide":33,"type":"blank","prompt":"_________ marketing refers to customized messages delivered to a specific individual or small group, often through direct mail, email, or personalized ads.","answerText":"Direct Marketing","explanation":"Direct marketing sends customized messages to specific individuals or small groups."},
    {"id":"q10","chapter":"message","price":1000,"deckSlide":63,"type":"mc","prompt":"A skincare brand launches a new campaign where a trusted dermatologist explains the scientific benefits of the product, including clinical trial results and proven outcomes. The ad includes before-and-after images of actual users to demonstrate effectiveness. Which creative execution style is primarily being used in this advertisement?","options":["Slice-of-Life","Scientific Evidence","Testimonial","Lifestyle"],"answerIndex":1,"explanation":"Scientific evidence ads rely on data, trials and demonstrations to prove the product works."},

    {"id":"q11","chapter":"demand","price":200,"deckSlide":41,"type":"mc","prompt":"In IMC, in terms of how quickly a message can be created and sent out, which media is the most suitable?","options":["Television","Newspaper","Magazines","Social"],"answerIndex":3,"explanation":"Social media posts can be created and published in minutes; print and TV have long lead times."},
    {"id":"q12","chapter":"demand","price":400,"deckSlide":43,"type":"mc","prompt":"Which of the following media has the lowest reach among potential audience?","options":["Television","Social Media","Direct Response","Newspaper"],"answerIndex":3,"explanation":"Per the chapter, newspaper reaches the smallest potential audience of these four."},
    {"id":"q13","chapter":"demand","price":600,"deckSlide":55,"type":"mc","prompt":"Which of the following is a primary disadvantage of using newspapers as an advertising medium?","options":["Limited geographic reach and lack of audience targeting","Short life span and declining readership among younger demographics","High production costs and inability to convey detailed information","Excessive lead time required to place ads and low message flexibility"],"answerIndex":1,"explanation":"A newspaper is read once and discarded, and younger audiences read it less."},
    {"id":"q14","chapter":"demand","price":800,"deckSlide":39,"type":"mc","prompt":"A smartphone company introduces a pull strategy to increase consumer demand at the retail level. Which of the following tactics BEST exemplifies a pull strategy?","options":["Offering volume discounts to retailers","Running national television ads and influencer campaigns to generate consumer interest","Providing financial incentives to salespeople to promote the product","Supplying retailers with free display stands and promotional materials"],"answerIndex":1,"explanation":"A pull strategy builds demand among consumers so they ask retailers for the product. The other options push through the channel."},
    {"id":"q15","chapter":"demand","price":1000,"deckSlide":49,"type":"mc","prompt":"A pharmaceutical company launches a new over-the-counter (OTC) allergy medication. It chooses to educate doctors and pharmacists about the product's effectiveness, offers volume discounts to retailers, and provides incentives for in-store promotions. At the same time, it runs national television campaigns and digital ads aimed at consumers, encouraging them to ask for the product by name at pharmacies. Which best describes the company's overall promotional strategy?","options":["Pure push strategy","Pure pull strategy","A hybrid strategy","A misaligned strategy"],"answerIndex":2,"explanation":"Trade incentives are push and consumer advertising is pull; using both is a hybrid strategy."},

    {"id":"q16","chapter":"social","price":200,"deckSlide":57,"type":"mc","prompt":"A fitness apparel brand runs an Instagram campaign encouraging followers to share workout photos wearing their gear, using a branded hashtag. The most creative posts are featured on the company's official page and rewarded with discounts. What two key social media marketing strategies is the company using in this campaign?","options":["Paid advertising and influencer endorsements","User-generated content and engagement-driven promotion","Direct selling and viral marketing","Retargeting and social listening"],"answerIndex":1,"explanation":"Customers create the content (UGC) and rewards drive engagement."},
    {"id":"q17","chapter":"social","price":400,"deckSlide":47,"type":"mc","prompt":"A cosmetics brand notices that although its social media posts receive high numbers of likes and shares, there is very little traffic converting to actual purchases from those platforms. Which social media metric should the brand focus on improving to better measure and increase conversion effectiveness?","options":["Impressions","Engagement rate","Click-through rate (CTR)","Follower growth rate"],"answerIndex":2,"explanation":"CTR shows how many people click through toward a purchase, which links social activity to conversions."},
    {"id":"q18","chapter":"social","price":600,"deckSlide":67,"type":"mc","prompt":"A sportswear company sponsors a major marathon event and uses real-time social media updates, live video coverage, and user-generated content contests to engage audiences during the race. What is the primary advantage of combining sponsorship with social media in this scenario?","options":["It reduces the need for traditional advertising channels","It creates passive brand exposure with minimal engagement","It enhances audience interaction and extends sponsorship impact beyond the event","It focuses only on post-event analysis for marketing insights"],"answerIndex":2,"explanation":"Social media lets audiences interact and carries the sponsorship beyond the event itself."},
    {"id":"q19","chapter":"social","price":800,"deckSlide":59,"type":"blank","prompt":"Microtargeting, originally used in political campaigns, is sometimes called _________ because it isolates markets using detailed data.","answerText":"Narrowcasting","explanation":"Narrowcasting aims messages at small, tightly defined audiences instead of broadcasting to everyone."},

}

});
function phoneLaunch() { const G = P.G; if (!G || G.mode !== 'brief') return; audInit(); if (AUD.music) musicStart(); fx('click'); G.mode = 'arcade'; phoneRender(); }
function phoneNext() { const G = P.G; if (!G || G.mode !== 'reveal') return; G.wave += 1; G.dbl = false; G.mode = G.wave >= G.ids.length ? 'done' : 'brief'; fx('click'); phoneRender(); }
document.addEventListener('keydown', (e) => {
  if (!isPhone || e.ctrlKey || e.metaKey || e.altKey) return;
  const el = document.activeElement; const typing = el && /INPUT|TEXTAREA/.test(el.tagName);
  if (typing) { if (e.key === 'Enter') { el.blur(); const b = document.querySelector('[data-p="code"],[data-p="name"]'); if (b) b.click(); } return; }
  const G = P.G; if (!G || !P.snap || P.snap.phase !== 'play') return;
  if (e.key === 'Enter' && G.mode === 'brief') { e.preventDefault(); phoneLaunch(); }
  else if (e.key === 'Enter' && G.mode === 'reveal') { e.preventDefault(); phoneNext(); }
  else if (G.mode === 'question') { const i = 'abcd'.indexOf(e.key.toLowerCase()); const j = '1234'.indexOf(e.key); const k = i >= 0 ? i : j; if (k >= 0) { e.preventDefault(); phoneAnswer(k); } }
});

/* ===================== start ===================== */
if (isPhone) phoneInit(); else { fit(); render(); }
</script>
