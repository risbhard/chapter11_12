<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUAD 200 · Chapter 8 · Social Media Strategy (feed view)</title>
<style>
:root{
  --mag:#E31B54; --mag2:#ff6a3d; --char:#3C3C3C; --teal:#0E5A5F; --maroon:#7B1F3A;
  --cream:#F5F1EA; --line:#dbdbdb; --mute:#737373; --bg:#fff; --blue:#0a66c2; --fb:#1877f2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#2b2b33,#0f0f13);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#262626}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:0 0}
.win{position:absolute;inset:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);display:flex;flex-direction:column}
.chrome{height:44px;background:#eceaee;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid #d3d0d6;flex:none}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.addr{flex:1;max-width:640px;margin:0 auto;height:28px;border-radius:14px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:13px;color:#555;gap:8px;overflow:hidden;white-space:nowrap}
.addr b{color:#111;font-weight:600}
.chrome .ct{width:150px;font-size:12px;color:#666;text-align:right}
.app{flex:1;display:flex;min-height:0}
/* sidebar */
.side{width:210px;border-right:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:4px;flex:none;background:#fff}
.brand{display:flex;align-items:center;gap:10px;padding:2px 12px 18px}
.brand img{height:34px}
.brand span{font-size:11px;letter-spacing:.14em;color:var(--mag);font-weight:700;line-height:1.2}
.nav{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;font-size:15px;text-align:left;width:100%}
.nav:hover{background:#f2f2f2}.nav.on{font-weight:700}
.nav svg{width:24px;height:24px;flex:none;stroke:#262626;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav.on svg{stroke-width:2.6}
.side .grow{flex:1}
.hint{font-size:11.5px;color:var(--mute);padding:8px 12px;line-height:1.5}
.hint kbd{background:#f0f0f0;border:1px solid #ddd;border-radius:4px;padding:0 5px;font-size:11px}
/* main */
.main{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;background:#fafafa}
.prog{display:flex;gap:4px;padding:10px 24px 0;flex:none}
.prog button{flex:1;height:4px;border-radius:3px;background:#dcdcdc;position:relative;padding:8px 0;background-clip:content-box}
.prog button.done{background:var(--mag);background-clip:content-box}
.prog button.cur{background:var(--char);background-clip:content-box}
.prog button:hover{filter:brightness(.85)}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 28px 4px;flex:none}
.eyebrow{font-size:11.5px;letter-spacing:.16em;font-weight:700;color:var(--mag);text-transform:uppercase}
.count{font-size:12px;color:var(--mute)}
.slide{flex:1;min-height:0;padding:4px 64px 18px;overflow:hidden;position:relative;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(var(--dx,24px))}to{opacity:1;transform:none}}
h1.t{font-size:34px;line-height:1.1;letter-spacing:-.02em;color:var(--char);margin:2px 0 14px;font-weight:800}
h1.t em{font-style:normal;color:var(--mag)}
.sub{color:var(--mute);font-size:15px;margin:-6px 0 14px}
.arrow{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:20;transition:.15s}
.arrow:hover{transform:scale(1.1);background:var(--mag)}.arrow:hover svg{stroke:#fff}
.arrow svg{width:22px;height:22px;stroke:#262626;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.arrow.l{left:10px}.arrow.r{right:10px}.arrow[disabled]{opacity:.25;pointer-events:none}
/* posts */
.row{display:grid;gap:22px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.post{background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.post.hl{box-shadow:0 0 0 3px var(--mag)}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);padding:2px}
.av i{width:100%;height:100%;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:#222;font-style:normal;font-size:10.5px}
.av.sq{border-radius:6px;background:var(--blue);padding:0}.av.sq i{background:var(--blue);color:#fff;border-radius:6px;font-size:13px}
.pn{font-size:13.5px;font-weight:700;line-height:1.2}.ps{font-size:11.5px;color:var(--mute)}
.ph .more{margin-left:auto;color:#555;letter-spacing:2px;font-weight:700}
.badge{font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:20px;background:#eef;color:#336;margin-left:auto}
.media{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,var(--maroon),var(--mag));color:#fff;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center}
.media.sq{aspect-ratio:1/1}.media.tall{aspect-ratio:9/16}
.media .thumb{position:absolute;inset:0;background-size:cover;background-position:center}
.media .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
.media .ttl{position:relative;z-index:2;text-align:center;padding:16px;font-weight:800;font-size:22px;line-height:1.15;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.media .ttl small{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;opacity:.9;margin-top:8px}
.play{position:absolute;z-index:3;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid #fff;display:flex;align-items:center;justify-content:center;transition:.15s}
.play:hover{background:var(--mag);transform:scale(1.1)}
.play:after{content:"";border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:5px}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:5;background:#000}
.tag{position:absolute;z-index:3;left:10px;bottom:10px;font-size:11px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:5px;letter-spacing:.04em}
.acts{display:flex;gap:14px;padding:9px 12px 2px;align-items:center}
.acts button{display:flex;padding:2px;border-radius:6px}
.acts svg{width:24px;height:24px;stroke:#262626;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.15s}
.acts .heart.on svg{fill:#ed4956;stroke:#ed4956;animation:pop .35s}
.acts .save.on svg{fill:#262626}
.acts .sp{margin-left:auto}
@keyframes pop{50%{transform:scale(1.35)}}
.cap{padding:2px 12px 8px;font-size:13.5px;line-height:1.45}
.cap b{font-weight:700}.cap .h{color:#00376b}
.src{margin:auto 12px 12px;font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--mag);text-decoration:none;text-transform:uppercase;display:inline-block;border-bottom:2px solid var(--mag);align-self:flex-start;padding-bottom:1px}
.src:hover{color:var(--maroon);border-color:var(--maroon)}
.rec{font-size:10.5px;color:var(--mute);padding:0 12px 8px}
.li .ph .more{color:#555}.li .media{background:linear-gradient(135deg,#0b3a5c,#0a66c2)}
.lireact{display:flex;gap:16px;padding:6px 12px 10px;border-top:1px solid #eee;font-size:13px;color:#555;font-weight:600}
.lireact span{display:flex;gap:6px;align-items:center}
.row.c2 .post .media,.row.c3 .post .media{aspect-ratio:16/8 !important}
.row.c2 .post .media .ttl{font-size:20px}
.note{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--mute);margin-top:8px}
/* callout bar */
.bar{display:flex;align-items:center;gap:14px;background:var(--char);color:#fff;border-radius:10px;padding:14px 18px;font-size:17px;margin-top:16px}
.bar small{font-size:11px;letter-spacing:.14em;color:#ff8fb0;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;border-top:3px solid var(--mag)}
.card.t{border-top-color:var(--teal)}.card.m{border-top-color:var(--maroon)}
.card small{display:block;font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--mag);margin-bottom:6px;text-transform:uppercase}
.card.t small{color:var(--teal)}.card.m small{color:var(--maroon)}
.card p{font-size:16px;line-height:1.4;color:#444}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:8px;background:#0095f6;color:#fff;font-weight:700;font-size:13.5px}
.btn.gray{background:#efefef;color:#262626}.btn.mag{background:var(--mag)}.btn.fb{background:var(--fb)}
.btn:hover{filter:brightness(.92)}
.pill{display:inline-block;padding:6px 14px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600}
/* stories */
.stories{display:flex;gap:22px;margin:6px 0 18px}
.story{display:flex;flex-direction:column;align-items:center;gap:8px;width:118px}
.ring{width:104px;height:104px;border-radius:50%;padding:4px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);transition:.2s}
.story:hover .ring{transform:scale(1.07)}
.ring.seen{background:#c7c7c7}
.ring i{display:flex;width:100%;height:100%;border-radius:50%;border:4px solid #fff;align-items:center;justify-content:center;font-style:normal;font-size:30px;font-weight:800;color:#fff}
.story span{font-size:13px;font-weight:600}
.ov{position:absolute;inset:0;background:rgba(10,10,12,.88);z-index:60;display:none;align-items:center;justify-content:center}
.ov.show{display:flex}
.xbtn{position:absolute;right:18px;top:12px;font-size:34px;color:#fff;z-index:5;line-height:1}
.sv{width:360px;height:640px;border-radius:14px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:34px;box-shadow:0 20px 60px #000}
.sv .sp{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:4px}
.sv .sp i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden;position:relative}
.sv .sp i.d:after,.sv .sp i.c:after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left}
.sv .sp i.c:after{animation:fill 6s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sv .hd{position:absolute;top:24px;left:14px;display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700}
.sv h2{font-size:38px;line-height:1.05;letter-spacing:-.02em;margin-bottom:14px}
.sv p{font-size:18px;line-height:1.4;opacity:.95}
.sv .zl,.sv .zr{position:absolute;top:60px;bottom:60px;width:40%;z-index:3}.sv .zl{left:0}.sv .zr{right:0}
.sv .cta{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.12em;font-weight:700;text-align:center;opacity:.9}
/* modal */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:70;display:none;align-items:center;justify-content:center;padding:34px 60px}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:6px;width:100%;max-width:1060px;height:100%;max-height:690px;display:flex;overflow:hidden}
.mleft{flex:1.35;background:#000;position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.mleft .media{width:100%;height:100%;aspect-ratio:auto;cursor:default}
.mleft .media.fit{height:auto;max-height:100%}
.mright{flex:1;display:flex;flex-direction:column;min-width:320px;overflow:auto}
.mright .ph{border-bottom:1px solid #efefef;padding:14px 16px}
.mbody{padding:14px 16px;font-size:14px;line-height:1.55;flex:1}
.mbody h4{font-size:11px;letter-spacing:.14em;color:var(--mag);margin:14px 0 4px;text-transform:uppercase}
.mbody ul{padding-left:18px}.mbody li{margin:3px 0}
.mfoot{padding:12px 16px;border-top:1px solid #efefef;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* profile */
.prof{display:flex;gap:44px;align-items:center;margin:2px 0 16px}
.bigav{width:150px;height:150px;border-radius:50%;padding:5px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);flex:none}
.bigav div{width:100%;height:100%;border-radius:50%;background:#fff;border:5px solid #fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bigav img{width:88%}
.uname{display:flex;align-items:center;gap:14px;font-size:20px;margin-bottom:10px}
.stats{display:flex;gap:30px;font-size:15px;margin-bottom:10px}
.bio{font-size:15px;line-height:1.45}
.bio .big{font-size:24px;font-weight:800;color:var(--char);letter-spacing:-.02em;line-height:1.15}.bio .big em{font-style:normal;color:var(--mag)}
.hls{display:flex;gap:26px;margin-bottom:14px}
.hls .ring{width:68px;height:68px;padding:3px}.hls .ring i{font-size:20px;border-width:3px}.hls .story{width:80px;gap:4px}.hls .story span{font-size:12px}
.tabs{display:flex;justify-content:center;gap:44px;border-top:1px solid var(--line);font-size:12px;letter-spacing:.12em;font-weight:700;color:var(--mute);padding:10px 0 12px}
.tabs .on{color:#262626;margin-top:-11px;border-top:1px solid #262626;padding-top:10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tile{aspect-ratio:4/3;border-radius:4px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:8px;font-size:12px;font-weight:700;line-height:1.15;text-align:left}
.tile:hover:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.28)}
.tile span.n{position:absolute;top:6px;right:8px;font-size:11px;opacity:.9}
/* misc */
.vote{display:flex;gap:10px;margin:10px 12px 12px}
.vote button{flex:1;padding:9px;border-radius:8px;border:2px solid var(--line);font-weight:700;font-size:14px;position:relative;overflow:hidden;background:#fff}
.vote button:hover{border-color:var(--mag)}.vote button.mine{border-color:var(--mag);background:#fff0f4}
.vote .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(227,27,84,.18);width:0;transition:width .5s}
.vote span{position:relative}
.dark{background:var(--char);color:#fff}
.slide.dk{background:var(--char);color:#fff}
.slide.dk h1.t{color:#fff}.slide.dk .eyebrow{color:#ff8fb0}
.live{display:inline-flex;gap:6px;align-items:center;background:var(--mag);color:#fff;font-weight:800;font-size:12px;letter-spacing:.1em;padding:4px 10px;border-radius:5px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.2}}
.msg{display:flex;gap:12px;align-items:flex-start;margin:12px 0}
.msg .num{width:40px;height:40px;border-radius:50%;background:var(--mag);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.msg .bub{background:#4b4b4b;border-radius:4px 18px 18px 18px;padding:12px 16px;max-width:620px}
.msg .bub b{display:block;font-size:19px;margin-bottom:2px}.msg .bub span{color:#ddd;font-size:15px}
.blank{display:inline-block;width:150px;font-size:22px;border:0;border-bottom:2px solid #ff8fb0;background:rgba(255,255,255,.08);color:#fff;font:inherit;padding:2px 8px;border-radius:4px 4px 0 0;text-align:center}
.blank::placeholder{color:#ff8fb0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;transition:.12s}
.chip:hover{border-color:var(--mag)}.chip.sel{background:var(--mag);border-color:var(--mag);color:#fff}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
table.cmp th{background:var(--char);color:#fff;text-align:left;padding:8px 9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
table.cmp td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;min-width:90px;height:64px}
table.cmp td:first-child{font-weight:800;background:#faf5f7;color:var(--mag);width:92px}
table.cmp td[contenteditable]:focus{outline:2px solid var(--mag);background:#fffafb}
table.cmp td[contenteditable]:empty:before{content:attr(data-ph);color:#b5b5b5;font-style:italic}
.notes{position:absolute;left:0;right:0;bottom:0;background:#17171b;color:#eee;z-index:55;padding:14px 28px;font-size:14px;line-height:1.5;display:none;border-top:3px solid var(--mag)}
.notes.show{display:block}.notes b{color:#ff8fb0;letter-spacing:.1em;font-size:11px}
.toast{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.fbgroup .cover{height:92px;background:linear-gradient(120deg,var(--teal),var(--maroon));position:relative}
.members{display:flex;margin-left:6px}.members i{width:28px;height:28px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:block}
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800}
.poll{background:linear-gradient(135deg,#7b1f3a,#e31b54);color:#fff;border-radius:14px;padding:18px;text-align:center}
.poll .q{font-weight:800;font-size:20px;margin-bottom:12px}
.poll button{display:block;width:100%;background:#fff;color:#222;border-radius:10px;padding:11px;margin:8px 0;font-weight:800;font-size:16px;position:relative;overflow:hidden}
.poll button .f{position:absolute;inset:0 auto 0 0;background:rgba(227,27,84,.25);width:0;transition:width .5s}
.poll button span{position:relative}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.flow .card{padding:14px}
.flow .chips .chip{font-size:12.5px;padding:5px 10px}
.adprev{margin-top:16px;display:flex;gap:18px;align-items:center}
.notif{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:14px}
.notif .ic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex:none}
.notif b{font-size:12px;letter-spacing:.14em;color:var(--mag);display:block}.notif p{font-size:19px;color:#333;margin-top:2px}
.ex{background:#fff;border-left:4px solid var(--mag);padding:12px 16px;border-radius:6px;font-size:20px;margin-bottom:14px}
.ex b{color:var(--mag)}
/* ---- live activity (host) ---- */
.lv{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.joinp{background:#fff;border:1px solid var(--line);border-top:3px solid var(--mag);border-radius:12px;padding:14px 16px}
.qrbox{width:236px;height:236px;flex:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.qrbox svg{width:100%;height:100%;display:block}
.code{font:800 46px/1.05 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.16em;color:var(--mag)}
.warnb{background:#fff7e6;border:1px solid #f5c26b;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4;color:#6b4a00;margin:6px 0}
.teams{display:flex;flex-wrap:wrap;gap:6px;max-height:84px;overflow:auto}
.tm{background:#fff0f4;color:var(--mag);border-radius:16px;padding:4px 11px;font-size:12.5px;font-weight:700}
.lb{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:40px 1.1fr 2fr 80px 150px;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.rk{font-size:22px;font-weight:800;color:var(--char);text-align:center}
.pips{display:flex;gap:6px}.pip{flex:1;height:14px;border-radius:7px;background:#e6e6e6;transition:.4s}
.pip.on{background:linear-gradient(90deg,var(--mag),var(--mag2))}
.pipl{display:flex;gap:6px;font-size:10px;color:#999;margin-top:3px}.pipl span{flex:1;text-align:center}

/* image layers: img/<postkey>.jpg (your own photo) on top, then the school's YouTube frame */
function thumbLayer(id){
 const m=P[id].media,yt=m.kind==="video"?m.id:m.thumb;
 const layers=["url(img/"+id+".jpg)"].concat(yt?["url(https://i.ytimg.com/vi/"+yt+"/hqdefault.jpg)"]:[]).join(",");
 return `<div class="thumb" style="background-image:${layers}"></div>`+(yt?'<div class="shade"></div>':"");
}

/* ---------- post rendering ---------- */
function mediaHTML(p,id,inline){
 const m=p.media,cls="media"+(m.sq?" sq":"")+(m.tall?" tall":"")+((m.kind==="video"||m.thumb)?" hasimg":"");
 const pl=m.kind==="video"?`<div class="play" data-play="${id}" title="Play here"></div>`:"";
 const tg=m.kind==="video"?"▶ Click to play":(m.thumb?"Click to open · image: frame from the school's video":"Click to open");
 return `<div class="${cls}" data-open="${id}" style="background:${m.grad}">${thumbLayer(id)}<div class="ttl" style="${m.kind==="video"?"position:absolute;top:10px;left:14px;text-align:left;font-size:16px;padding:0":""}">${m.logo?`<img class="mlogo" src="${m.logo}" alt="" onerror="this.remove()">`:""}${m.ttl}<small>${m.small}</small></div>${pl}<div class="tag">${tg}</div></div>`;
}
function post(id,extra={}){
 const p=P[id],li=p.pf==="li",isY=p.pf==="yt";
 const av=li?`<div class="av sq"><i>${p.av}</i></div>`:`<div class="av"><i>${p.av}</i></div>`;
 const acts=li?`<div class="lireact"><span>👍 Like</span><span>💬 Comment</span><span>🔁 Repost</span><span>✈ Send</span></div>`:
  `<div class="acts"><button class="heart" data-like aria-label="Like">${ICON.heart}</button><button>${ICON.comment}</button><button>${ICON.share}</button><button class="save sp" data-save>${ICON.save}</button></div>`;
 return `<article class="post ${li?"li":""} ${extra.cls||""}" id="post-${id}">
  <div class="ph">${av}<div><div class="pn">${p.name}</div><div class="ps">${p.sub}</div></div>${extra.badge?`<span class="badge">${extra.badge}</span>`:`<span class="more">···</span>`}</div>
  ${mediaHTML(p,id)}${acts}<div class="cap" data-open="${id}" title="Open full description">${p.cap}</div>
  ${extra.mid||""}
  <div class="rec">Layout and caption recreate the public page; not a screenshot.</div>
  <a class="src more" data-open="${id}" href="javascript:void(0)">Read full description ↗</a><a class="src" href="${p.src}" target="_blank" rel="noopener">View original source ↗</a></article>`;
}

}

   ch=ably.channels.get(chName);
   ch.subscribe("m",m=>{if(m.data&&m.data.from!==ME)onMsg(m.data)});
   ably.connection.on(s=>{if(s.current==="connected")onStatus("live");else if(["failed","suspended","disconnected"].includes(s.current))onStatus("error",s.current)});
   ch.on("failed",s=>onStatus("error","channel: "+((s.reason&&s.reason.message)||"denied")));
  }).catch(()=>local("Ably could not load; same-browser mode"));
 }else local("no Ably key");
 return api;
}

const H={G:null,net:null,status:"",why:"",dirty:false,_tm:null,bots:null};
const genCode=()=>{const a="ABCDEFGHJKMNPQRSTUVWXYZ";let c="";for(let i=0;i<4;i++)c+=a[Math.floor(Math.random()*a.length)];return c};
const newG=()=>({code:genCode(),phase:"lobby",teams:{},first:{},votes:{},poll:{},started:null});
function ensureHost(){
 if(!H.G){const j=lsGet("ch8live");H.G=(j&&j.code)?j:newG();if(!(j&&j.code))saveG();}
 if(!H.net)H.net=makeNet(H.G.code,hostMsg,(s,w)=>{H.status=s;H.why=w||"";refreshLive();});
}
function resetHost(){
 if(H.bots){clearInterval(H.bots);H.bots=null;}
 H.G=newG();H.net=null;H.status="";saveG();ensureHost();refreshLive();
}
const saveG=()=>lsSet("ch8live",H.G);
function hostMsg(m){
 const G=H.G;if(!G||!m||!m.t)return;
 if(m.t==="join"||m.t==="hello"){
  let t=G.teams[m.id];
  const isNew=!t;
  if(!t){if(!m.name)return;t=G.teams[m.id]={id:m.id,name:String(m.name).slice(0,24),platforms:[],f:{},rec:"",bonus:0,joined:Date.now()};}
  else if(m.name)t.name=String(m.name).slice(0,24);
  sync(isNew);
 }else if(m.t==="state"){
  let t=G.teams[m.id];
  if(!t){t=G.teams[m.id]={id:m.id,name:String(m.name||"Team").slice(0,24),platforms:[],f:{},rec:"",bonus:0,joined:Date.now()};}
  if(G.phase!=="research"&&G.phase!=="lobby")return;
  t.platforms=(Array.isArray(m.platforms)?m.platforms:[]).filter((p,i,a)=>PLATS.includes(p)&&a.indexOf(p)===i).slice(0,3);t.f=m.f||{};t.rec=String(m.rec||"").slice(0,600);
  stepsOf(t).forEach((v,i)=>{if(v&&!G.first[i])G.first[i]=t.id});
  sync();
 }else if(m.t==="vote"){
  if(G.phase==="voting"&&m.for!==m.id&&G.teams[m.for]&&G.teams[m.id]&&String(G.teams[m.for].rec||"").trim().length>=25){G.votes[m.id]=m.for;sync();}
 }else if(m.t==="poll"){
  if(G.phase==="poll"&&G.teams[m.id]&&(m.v==="most"||m.v==="right")){G.poll[m.id]=m.v;sync();}
 }
}
function ranking(){const G=H.G;return Object.values(G.teams).map(t=>({t,pts:scoreOf(t,G)})).sort((a,b)=>b.pts-a.pts||a.t.joined-b.t.joined)}
function sync(now){
 H.dirty=true;if(H._tm&&!now)return;if(H._tm)clearTimeout(H._tm);
 H._tm=setTimeout(()=>{H._tm=null;if(!H.dirty)return;H.dirty=false;broadcast();},now?0:350);
}
function broadcast(){
 const G=H.G,rows=ranking(),scores={};
 rows.forEach((r,i)=>scores[r.t.id]={pts:r.pts,rank:i+1,n:rows.length,steps:stepsOf(r.t).map(Number)});
 const cands=(G.phase==="voting"||G.phase==="poll"||G.phase==="done")?Object.values(G.teams).filter(t=>G.phase!=="voting"||String(t.rec||"").trim().length>=25).map(t=>({id:t.id,name:t.name,rec:t.rec,pl:t.platforms})):[];
 if(H.net)H.net.send({t:"sync",code:G.code,phase:G.phase,scores,cands});
 saveG();refreshLive();
}
function setPhase(p){
 const G=H.G;G.phase=p;if(p==="research"&&!G.started)G.started=Date.now();
 sync(true);
}
function award(id,n){const t=H.G.teams[id];if(t){t.bonus=(t.bonus||0)+n;sync(true);}}
function joinURL(){

}
function qrSVG(url){try{const q=qrcode(0,"M");q.addData(url);q.make();return q.createSvgTag({cellSize:6,margin:0,scalable:true});}catch(e){return '<div style="padding:20px;font-size:13px">QR could not be drawn. Use the code instead.</div>'}}

 },1500);

  else if(P.phase==="lobby"){body=`<div class="pw"><div class="big">You're in 🎉</div><p>Waiting for the instructor to start the activity.</p></div>`;}
  else if(P.phase==="research"){body=researchHTML();}
  else if(P.phase==="voting"){
   const others=P.cands.filter(c=>c.id!==P.id);
   body=`<div class="pv"><h3>Vote: best KCMS recommendation</h3><p class="s">You can't vote for your own group.</p>${others.map(c=>`<button class="vc ${P.vote===c.id?"sel":""}" data-v="${c.id}"><b>${esc(c.name)}</b><span>${(c.pl||[]).map(esc).join(" · ")}</span><em>${esc(c.rec)||"No recommendation"}</em></button>`).join("")||"<p>No other groups yet.</p>"}</div>`;
  }else if(P.phase==="poll"){
   body=`<div class="pv"><h3>Most users, or the right users?</h3><p class="s">Should a business choose a platform because it has the most users, or because it has the right users?</p><button class="vc big ${P.poll==="most"?"sel":""}" data-p="most">Most users</button><button class="vc big ${P.poll==="right"?"sel":""}" data-p="right">Right users</button></div>`;
  }else{body=`<div class="pw"><div class="big">That's a wrap</div><p>${P.sc?`You finished <b>#${P.sc.rank}</b> of ${P.sc.n} with <b>${P.sc.pts} points</b>.`:"Thanks for taking part."}</p></div>`;}
  root.innerHTML=head()+body;
  wireBody();updHead();
 }
 function researchHTML(){
  const st=stp(),t=P.tab;
  const tabs=STEPN.map((n,i)=>`<button class="tb ${i===t?"cur":""} ${st[i]?"ok":""}" data-tab="${i}">${i+1}<small>${i==0?"Pick":i<4?"P"+i:"KCMS"}</small></button>`).join("");
  let inner="";
  if(t===0){inner=`<h3>Pick 3 platforms</h3><p class="s">Chosen ${P.platforms.length} of 3. Tap again to remove.</p><div class="chs">${PLATS.map(p=>`<button class="ch ${P.platforms.includes(p)?"sel":""}" data-pl="${p}">${p}</button>`).join("")}</div>`;}
  else if(t<4){
   const p=P.platforms[t-1];
   if(!p)inner=`<p class="s">Pick your platforms in step 1 first.</p>`;
   else{const f=P.f[p]||{};inner=`<h3>${esc(p)}</h3><p class="s">Use credible, recent sources. If you can't find it, tap “Not available”. Don't guess.</p>${FIELDS.map(([k,l],i)=>`<label>${esc(l)}</label><textarea rows="${i>=4&&i<6?3:2}" data-f="${k}">${esc(f[k]||"")}</textarea>${i<4?`<button class="na" data-na="${k}">Not available</button>`:""}`).join("")}`;}
  }else{inner=`<h3>Which platform for KCMS, and why?</h3><p class="s">Kelowna Community Music School. Tie your answer to the audience you found.</p><textarea rows="7" id="rec" placeholder="We recommend ___ because ___ (audience, behaviour, fit)">${esc(P.rec)}</textarea><div class="s" id="rc">${(P.rec||"").trim().length} characters (25+ to count)</div>`;}
  return `<div class="tbs">${tabs}</div><div class="pf">${inner}<div class="svd" id="sv"></div><div class="nv"><button class="pb sm" data-nav="-1" ${t===0?"disabled":""}>Back</button><button class="pb sm" data-nav="1" ${t===4?"disabled":""}>Next</button></div></div>`;
 }
 function wireBody(){
  root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{P.tab=+b.dataset.tab;render();});
  root.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{P.tab=Math.max(0,Math.min(4,P.tab+ +b.dataset.nav));render();window.scrollTo(0,0);});
  root.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{const p=b.dataset.pl,i=P.platforms.indexOf(p);if(i>=0)P.platforms.splice(i,1);else if(P.platforms.length<3)P.platforms.push(p);else{return;}sendState();render();});
  root.querySelectorAll("[data-f]").forEach(el=>el.oninput=()=>{const p=P.platforms[P.tab-1];(P.f[p]=P.f[p]||{})[el.dataset.f]=el.value;sendState();updHead();});
  root.querySelectorAll("[data-na]").forEach(b=>b.onclick=()=>{const p=P.platforms[P.tab-1];(P.f[p]=P.f[p]||{})[b.dataset.na]="Not available";sendState();render();});
  const r=$r("#rec");if(r)r.oninput=()=>{P.rec=r.value;sendState();updHead();const c=$r("#rc");if(c)c.textContent=P.rec.trim().length+" characters (25+ to count)";};
  root.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{P.vote=b.dataset.v;P.net&&P.net.send({t:"vote",id:P.id,for:P.vote});render();});
  root.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{P.poll=b.dataset.p;P.net&&P.net.send({t:"poll",id:P.id,v:P.poll});render();});
 }
 render();if(P.joined)connect();
}

/* keyboard */
const ACT="[data-open],[data-go],[data-story],[data-pv]";
function a11y(){document.querySelectorAll(ACT).forEach(el=>{if(!/^(BUTTON|A|INPUT)$/.test(el.tagName)&&!el.hasAttribute("tabindex")){el.tabIndex=0;el.setAttribute("role","button");}});}
{let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;a11y();});}).observe(document.body,{childList:true,subtree:true});a11y();}
document.addEventListener("keydown",e=>{
 if(isPhone)return;
 const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable;
 if(typing)return;
 if((e.key==="Enter"||e.key===" ")&&e.target.closest){
  if(/^(BUTTON|A)$/.test(e.target.tagName))return;
  const act=e.target.closest(ACT);if(act){e.preventDefault();act.click();return;}
 }
 if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();next();}
 else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();prev();}
 else if(e.key==="Home")go(0);else if(e.key==="End")go(DECK.length-1);
 else if(e.key==="Escape")closeAll();
 else if(e.key==="n"||e.key==="N")$("#notes").classList.toggle("show");
 else if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
});
/* fit stage to window */
function fit(){const s=Math.min(innerWidth/1280,innerHeight/800)*0.98;const st=$("#stage");st.style.transform=`scale(${s}) translate(-50%,-50%)`;}
addEventListener("resize",fit);fit();
if(isPhone){phoneApp();}else{const h=parseInt(location.hash.slice(1));cur=(h>=1&&h<=DECK.length)?h-1:0;draw();}
</script>
